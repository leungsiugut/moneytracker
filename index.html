<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MoneyTracker</title>

  <!-- iOS PWA 獨立 App 配置與 Meta Tags -->
  <meta name="apple-mobile-web-app-title" content="MoneyTracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF9F6">

  <!-- iOS 桌面圖示 (Apple Touch Icon)：深灰底 + 暖黃幾何金幣豬仔 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='42' fill='%23343A40'/><path d='M36 68 C36 65 39 63 42 63 L48 63 L56 36 C57 32 63 32 66 35 L75 48 C95 44 116 46 132 54 C148 63 158 78 158 96 C158 108 154 118 146 126 C147 130 152 135 158 135 C163 135 166 130 166 123 C166 121 169 119 171 121 C173 123 173 126 172 130 C169 142 161 147 151 146 C145 145 139 140 135 136 C123 143 109 146 95 146 L95 153 C95 157 91 160 86 160 L78 160 C74 160 71 157 71 153 L71 146 L55 146 L55 153 C55 157 51 160 47 160 L39 160 C34 160 31 157 31 153 L31 138 C23 128 18 115 18 100 C18 97 18 95 18 92 L14 92 C10 92 7 89 7 85 L7 75 C7 71 10 68 14 68 Z' fill='%23FFC107'/><path d='M95 45 C109 45 123 48 135 55 C150 64 158 79 158 96 C158 108 154 118 146 126 C147 130 152 135 158 135 C163 135 166 130 166 123 C166 121 169 119 171 121 C173 123 173 126 172 130 C169 142 161 147 151 146 C145 145 139 140 135 136 C123 143 109 146 95 146 Z' fill='%23FFA000' opacity='0.35'/><rect x='80' y='52' width='30' height='7' rx='3.5' fill='%23343A40'/><circle cx='54' cy='78' r='6' fill='%23343A40'/><circle cx='95' cy='102' r='28' fill='%23FFD54F' stroke='%23343A40' stroke-width='4'/><circle cx='95' cy='102' r='24' fill='none' stroke='%23343A40' stroke-width='1.5' stroke-dasharray='3 2'/><text x='95' y='111' font-size='26' font-family='-apple-system, sans-serif' font-weight='900' fill='%23343A40' text-anchor='middle'>$</text></svg>">

  <!-- 瀏覽器分頁 Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">

  <!-- 支援 PWA 安裝之 Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    %22name%22:%22MoneyTracker%22,
    %22short_name%22:%22MoneyTracker%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23FAF9F6%22,
    %22theme_color%22:%22%23343A40%22,
    %22icons%22:[{
      %22src%22:%22data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='42' fill='%23343A40'/><path d='M36 68 C36 65 39 63 42 63 L48 63 L56 36 C57 32 63 32 66 35 L75 48 C95 44 116 46 132 54 C148 63 158 78 158 96 C158 108 154 118 146 126 C147 130 152 135 158 135 C163 135 166 130 166 123 C166 121 169 119 171 121 C173 123 173 126 172 130 C169 142 161 147 151 146 C145 145 139 140 135 136 C123 143 109 146 95 146 L95 153 C95 157 91 160 86 160 L78 160 C74 160 71 157 71 153 L71 146 L55 146 L55 153 C55 157 51 160 47 160 L39 160 C34 160 31 157 31 153 L31 138 C23 128 18 115 18 100 C18 97 18 95 18 92 L14 92 C10 92 7 89 7 85 L7 75 C7 71 10 68 14 68 Z' fill='%23FFC107'/><path d='M95 45 C109 45 123 48 135 55 C150 64 158 79 158 96 C158 108 154 118 146 126 C147 130 152 135 158 135 C163 135 166 130 166 123 C166 121 169 119 171 121 C173 123 173 126 172 130 C169 142 161 147 151 146 C145 145 139 140 135 136 C123 143 109 146 95 146 Z' fill='%23FFA000' opacity='0.35'/><rect x='80' y='52' width='30' height='7' rx='3.5' fill='%23343A40'/><circle cx='54' cy='78' r='6' fill='%23343A40'/><circle cx='95' cy='102' r='28' fill='%23FFD54F' stroke='%23343A40' stroke-width='4'/><circle cx='95' cy='102' r='24' fill='none' stroke='%23343A40' stroke-width='1.5' stroke-dasharray='3 2'/><text x='95' y='111' font-size='26' font-family='-apple-system, sans-serif' font-weight='900' fill='%23343A40' text-anchor='middle'>$</text></svg>%22,
      %22sizes%22:%22180x180%22,
      %22type%22:%22image/svg+xml%22
    }]
  }">

  <!-- 外部依賴 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- 外部 CSS 樣式引入 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PWA 下拉刷新提示指示器 -->
  <div id="pwa-pull-indicator">
    <span>🔄 放開以重新整理網頁...</span>
  </div>

  <header>
    <div class="header-left">
      <div class="net-worth-box" onclick="openReportModal()" title="點擊檢視資產走勢">
        <span class="net-worth-title" id="header-networth-title">Net Worth (CAD 📈)</span>
        <span class="net-worth-amt" id="total-net-worth">$0.00</span>
        <!-- 下移之 Sync 狀態標籤 -->
        <div class="sync-status" id="sync-status-indicator" onclick="event.stopPropagation(); manualSyncFromCloud();" title="點擊連線或重整雲端">
          <span>☁️</span> <span id="sync-status-text">未連線（點擊設定）</span>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <!-- 純 Icon 頂部按鈕 -->
      <input type="file" id="ocr-file-input" accept="image/*" style="display: none;" onchange="handleOCRImageSelected(event)">
      <button type="button" class="btn-action btn-secondary" onclick="document.getElementById('ocr-file-input').click()" style="position: relative; z-index: 1001;" title="截圖記帳">📷</button>
      
      <input type="file" id="mw-csv-file" accept=".csv" style="display: none;" onchange="handleCSVFileSelected(event)">
      <button type="button" class="btn-action btn-secondary" onclick="document.getElementById('mw-csv-file').click()" title="匯入 CSV">📁</button>
      <button type="button" class="btn-action btn-secondary" onclick="openSettingsModal()" title="設定">⚙️</button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-actions">
        <button class="btn-action" style="flex:1;" onclick="openAccountModal()">+ 新增 Account</button>
        <button class="btn-action btn-secondary" style="flex:1;" onclick="openGroupModal()">+ 新增 Group</button>
      </div>
      <div id="sidebar-accounts" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>

    <div class="main-detail" id="main-detail-scroll" onscroll="handleMainScroll(this)">
      <div class="sticky-control-panel">
        <div class="detail-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <!-- 圖示化返回按鈕 -->
            <button class="btn-back" onclick="goBackToList()" title="返回">‹</button>
            <div>
              <h2 id="current-account-name" style="font-size: 17px; font-weight: 700;">請選擇帳戶</h2>
              <div id="current-account-balance" style="font-size: 13px; color: var(--text-muted); font-weight: 600;">$0.00</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <!-- 圖示化編輯筆與加號按鈕 -->
            <button class="btn-action btn-secondary" onclick="openEditAccountModal()" title="帳戶設定">✏️</button>
            <button class="btn-action" onclick="openTxModal()" title="記一筆">＋</button>
          </div>
        </div>

        <div class="search-bar-wrap">
          <span>🔍</span>
          <input type="text" class="search-input" id="tx-search-input" placeholder="搜尋交易商戶、分類、備註、日期..." oninput="handleSearchInput(this.value)">
        </div>

        <div class="invest-subtabs" id="invest-subtabs" style="display: none;">
          <div class="invest-tab-group">
            <button class="invest-tab-btn active" id="tab-btn-holdings" onclick="switchInvestSubTab('holdings')">Holdings (持倉)</button>
            <button class="invest-tab-btn" id="tab-btn-txs" onclick="switchInvestSubTab('transactions')">Transactions (流水帳)</button>
          </div>
          <button class="btn-action btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="refreshLiveStockPrices()">🔄 更新市價</button>
        </div>
      </div>

      <div id="content-container"></div>
    </div>
  </div>

  <button class="back-to-top-btn" id="btn-back-to-top" onclick="scrollToTop()" title="回到頂部">↑</button>

  <!-- Modal：綜合設定 (Settings) -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card" style="max-width: 520px;">
      <div class="modal-header">
        <span>⚙️ 系統設定</span>
        <button onclick="closeModal('settings-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>基準貨幣</label>
          <select id="setting-base-currency" onchange="changeBaseCurrency(this.value)"></select>
        </div>
        <div class="form-group">
          <label>Google Apps Script Web App URL</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="setting-cloud-url" placeholder="https://script.google.com/macros/s/.../exec" style="flex:1;">
            <button class="btn-action" onclick="saveCloudConfigFromSettings()">儲存連線</button>
          </div>
        </div>
        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 6px 0;">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">分類管理</label>
            <button class="btn-action" style="padding: 4px 10px; font-size: 11px;" onclick="openAddCategoryModal(null)">+ 新增父類別</button>
          </div>
          <div class="type-tabs" style="margin-bottom: 8px;">
            <button type="button" class="type-tab active" id="tab-cat-exp" onclick="switchCatViewType('expense')">Expenses</button>
            <button type="button" class="type-tab" id="tab-cat-inc" onclick="switchCatViewType('income')">Incomes</button>
          </div>
          <div id="cat-tree-container" style="display: flex; flex-direction: column; max-height: 260px; overflow-y: auto;"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" onclick="closeModal('settings-modal')">關閉</button>
      </div>
    </div>
  </div>

  <!-- Modal：交易錄入 -->
  <div class="modal-overlay" id="tx-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="tx-modal-title">記一筆交易</span>
        <button onclick="closeModal('tx-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="tx-id">
        <div class="type-tabs" id="modal-type-tabs"></div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
          <input type="checkbox" id="tx-is-pending" style="width: 16px; height: 16px; cursor: pointer;">
          <label for="tx-is-pending" style="font-size: 13px; font-weight: 600; cursor: pointer;">🚩 標記為未還 / Pending（置頂釘選）</label>
        </div>

        <!-- 轉出列（單純帳戶或轉帳/換匯轉出列一行並排） -->
        <div id="f-group-from-container">
          <div class="form-group" id="f-group-single-acc">
            <label id="label-from-acc">帳戶</label>
          </div>
          <div class="form-row-inline" id="f-row-from" style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <select id="tx-from-acc" style="flex: 2;" onchange="handleFromAccountChange()"></select>
            <select id="tx-from-currency" style="flex: 1; display: none;" onchange="handleFromCurrencyChange()"></select>
          </div>
        </div>

        <!-- 轉入列（轉帳/換匯轉入列一行並排） -->
        <div id="f-group-target-container" style="display: none;">
          <div class="form-group">
            <label>轉入戶口</label>
          </div>
          <div class="form-row-inline" id="f-row-target" style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <select id="tx-target-acc" style="flex: 2;" onchange="handleToAccountChange()"></select>
            <select id="tx-to-currency" style="flex: 1;" onchange="handleToCurrencyChange()"></select>
          </div>
        </div>

        <div class="form-group" id="f-group-title">
          <label id="label-title">標題 / 商戶</label>
          <input type="text" id="tx-title" placeholder="例如：Specialty Coffee">
        </div>

        <div class="form-group" id="f-group-category">
          <label>分類</label>
          <select id="tx-category"></select>
        </div>

        <div class="form-group" id="f-group-amount">
          <label id="label-amount">金額</label>
          <input type="number" step="0.01" id="tx-amount" placeholder="0.00">
        </div>

        <div id="f-group-exchange" style="display: none; display: flex; flex-direction: column; gap: 12px;">
          <div class="form-group">
            <label id="label-from-amount">轉出金額</label>
            <input type="number" step="0.01" id="tx-from-amount" placeholder="0.00" oninput="handleExchangeInput('from')">
          </div>
          <div class="form-group">
            <label id="label-to-amount">轉入金額</label>
            <input type="number" step="0.01" id="tx-to-amount" placeholder="0.00" oninput="handleExchangeInput('to')">
          </div>
          <div class="form-group">
            <label>匯率</label>
            <div style="display: flex; gap: 8px;">
              <input type="number" step="0.0001" id="tx-exchange-rate" placeholder="0.0000" style="flex: 1;" oninput="handleExchangeInput('rate')">
              <button class="btn-action btn-secondary" type="button" onclick="fetchLiveExchangeRate(true)">🌐 即時匯率</button>
            </div>
          </div>
        </div>

        <div class="form-group" id="f-group-commission" style="display: none;">
          <label>手續費</label>
          <input type="number" step="0.01" id="tx-commission" placeholder="0.00">
        </div>

        <div id="f-group-stock" style="display: none; display: flex; flex-direction: column; gap: 12px;">
          <div class="form-group">
            <label>股票代號</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="tx-stock-symbol" placeholder="例如：HXT.TO / AAPL" oninput="this.value = this.value.toUpperCase()" style="flex: 1;">
              <button class="btn-action btn-secondary" id="btn-quote-search" type="button" onclick="fetchQuoteForInput()">🔍 查 Yahoo 市價</button>
            </div>
          </div>
          <div class="form-group" id="stock-shares-box">
            <label>股數</label>
            <input type="number" step="0.0001" id="tx-stock-shares" placeholder="0" oninput="calcStockTotal()">
          </div>
          <div class="form-group" id="stock-price-box">
            <label>每股價格</label>
            <input type="number" step="0.01" id="tx-stock-price" placeholder="0.00" oninput="calcStockTotal()">
          </div>
          <div class="form-group" id="label-stock-total">
            <label>總結算金額</label>
            <input type="number" step="0.01" id="tx-stock-total" placeholder="0.00">
          </div>
          <div class="form-group" id="stock-commission-box">
            <label>手續費</label>
            <input type="number" step="0.01" id="tx-stock-commission" placeholder="0.00">
          </div>
        </div>

        <div class="form-group">
          <label>日期</label>
          <input type="date" id="tx-date">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" id="btn-delete-tx" onclick="deleteCurrentTx()" style="display:none; color:#D95D5D;">刪除</button>
        <button class="btn-action btn-secondary" onclick="closeModal('tx-modal')">取消</button>
        <button class="btn-action" onclick="saveTransaction()">確認儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal：新增 / 編輯 Category -->
  <div class="modal-overlay" id="cat-edit-modal">
    <div class="modal-card" style="max-width: 380px;">
      <div class="modal-header">
        <span id="cat-edit-modal-title">分類設定</span>
        <button onclick="closeModal('cat-edit-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-cat-id">
        <input type="hidden" id="edit-cat-parent-id">
        <input type="hidden" id="edit-cat-flow-type">
        <div class="form-group">
          <label>分類名稱</label>
          <input type="text" id="edit-cat-name" placeholder="例如：Car Insurance / Salary">
        </div>
        <div class="form-group">
          <label>Emoji 圖標</label>
          <input type="text" id="edit-cat-icon" placeholder="例如：🚗 / 💼">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" id="btn-delete-cat" onclick="deleteCurrentCategory()" style="display:none; color:#D95D5D;">刪除</button>
        <button class="btn-action btn-secondary" onclick="closeModal('cat-edit-modal')">取消</button>
        <button class="btn-action" onclick="saveCategory()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal：Account 管理 -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="account-modal-title">帳戶設定</span>
        <button onclick="closeModal('account-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="acc-id">
        <div class="form-group">
          <label>帳戶名稱</label>
          <input type="text" id="acc-name" placeholder="例如：Amex Cobalt / Wealthsimple">
        </div>
        <div class="form-group">
          <label>貨幣單位</label>
          <select id="acc-currency"></select>
        </div>
        <div class="form-group">
          <label>所屬分組</label>
          <select id="acc-group-id"></select>
        </div>
        <div class="form-group">
          <label>帳戶類型</label>
          <select id="acc-type">
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
            <option value="credit">Credit Card</option>
            <option value="investment">Investment</option>
            <option value="cash">Cash</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始現金餘額</label>
          <input type="number" step="0.01" id="acc-initial-balance" placeholder="0.00">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" id="btn-delete-acc" onclick="deleteCurrentAccount()" style="display:none; color:#D95D5D;">刪除</button>
        <button class="btn-action btn-secondary" onclick="closeModal('account-modal')">取消</button>
        <button class="btn-action" onclick="saveAccount()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal：Group 管理 -->
  <div class="modal-overlay" id="group-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="group-modal-title">帳戶分組設定</span>
        <button onclick="closeModal('group-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="group-id">
        <div class="form-group">
          <label>分組名稱</label>
          <input type="text" id="group-name" placeholder="例如：Everyday Banking">
        </div>
        <div class="form-group">
          <label>分組結算幣種</label>
          <select id="group-currency"></select>
        </div>
        <div class="form-group">
          <label>主題顏色</label>
          <div class="color-swatch-picker" id="group-swatch-picker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" id="btn-delete-group" onclick="deleteCurrentGroup()" style="display:none; color:#D95D5D;">刪除</button>
        <button class="btn-action btn-secondary" onclick="closeModal('group-modal')">取消</button>
        <button class="btn-action" onclick="saveGroup()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal：Net Worth 走勢圖 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-card" style="max-width: 650px;">
      <div class="modal-header">
        <span id="report-modal-title">📈 Net Worth Over Time (資產走勢)</span>
        <button onclick="closeModal('report-modal')" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <canvas id="netWorthChart" height="260"></canvas>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-secondary" onclick="closeModal('report-modal')">關閉</button>
      </div>
    </div>
  </div>

  <!-- 外部邏輯腳本引入 -->
  <script src="app.js"></script>
</body>
</html>
